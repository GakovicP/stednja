<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Štednja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Štedna knjižica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:1.8rem}
.err{color:var(--spend);font-size:.88rem;margin:0;min-height:1.2em}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.status{font-size:.78rem;color:var(--muted)}
.item small .by{opacity:.8}
/* Layout: one narrow column like a passbook page — month header, balance, then income → fixed → daily spending */
:root{
  --bg:#EEF2F0; --card:#FFFFFF; --ink:#13201C; --muted:#5D6B66; --line:#D6DFDB;
  --accent:#1E6B57; --accent-soft:#DCEDE6; --spend:#A84B2A; --spend-soft:#F6E4DC;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --c1:#1E6B57;--c2:#C08A2E;--c3:#3F6FA8;--c4:#9A4F86;--c5:#A84B2A;--c6:#6C7A75;--c7:#4F8F3A;--c8:#2C8A8A;--c9:#7A5C3E;--c10:#C2577A;--c11:#5B5FB0;--c12:#8A8F2E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --card:#18221F; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3632;
  --accent:#5FBF9F; --accent-soft:#1C3530; --spend:#E58B66; --spend-soft:#3A241B;
  --c1:#5FBF9F;--c2:#E0B25A;--c3:#7FA8DE;--c4:#CF8FC0;--c5:#E58B66;--c6:#97A6A1;--c7:#8CC66F;--c8:#6CC9C9;--c9:#C9A27C;--c10:#E88AAA;--c11:#9DA1EA;--c12:#C7CC6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --card:#18221F; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3632;
  --accent:#5FBF9F; --accent-soft:#1C3530; --spend:#E58B66; --spend-soft:#3A241B;
  --c1:#5FBF9F;--c2:#E0B25A;--c3:#7FA8DE;--c4:#CF8FC0;--c5:#E58B66;--c6:#97A6A1;--c7:#8CC66F;--c8:#6CC9C9;--c9:#C9A27C;--c10:#E88AAA;--c11:#9DA1EA;--c12:#C7CC6A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.1rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;width:100%}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:1.35rem}
.month{display:flex;align-items:center;gap:4px}
.month span{font-weight:600;min-width:9.5em;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}

.balance{background:var(--accent);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
:root .balance{--on:#fff}
.balance .label{color:rgba(255,255,255,.75)}
.balance .big{font-size:2.4rem;line-height:1.1}
.balance.neg{background:var(--spend)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .balance{color:#0F1614}:root:not([data-theme="light"]) .balance .label{color:rgba(15,22,20,.7)}}
:root[data-theme="dark"] .balance{color:#0F1614}:root[data-theme="dark"] .balance .label{color:rgba(15,22,20,.7)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.flow .num{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.total{font-size:.85rem;opacity:.9}

section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.row input{flex:1 1 0}
.row .add{flex:none}
.row input.amt{flex:0 0 84px}
.row input[type=date]{flex:0 0 150px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted);display:block;font-size:.8rem}
.del{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;flex:none}
.del:hover{background:var(--spend-soft);color:var(--spend)}
.add{border:0;background:var(--ink);color:var(--card);border-radius:8px;padding:10px 14px;font-weight:600;white-space:nowrap}
.add.primary{background:var(--accent);color:#fff;width:100%;padding:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add.primary{color:#0F1614}}
:root[data-theme="dark"] .add.primary{color:#0F1614}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.fixed-amt{color:var(--spend)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.amount-in{font-family:var(--mono);font-size:1.4rem;padding:12px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg)}
.stack i{height:100%}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.cats div{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.cats .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.day{font-size:.78rem;color:var(--muted);font-weight:600;padding-top:10px}
.vault{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.vault .big{font-size:2.1rem;line-height:1.1;color:var(--accent)}
.vault.neg .big{color:var(--spend)}
.hist{display:flex;align-items:flex-end;gap:6px;height:64px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.hist i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.hist i.neg{background:var(--spend)}
.hist span{font-size:.68rem;color:var(--muted)}
.rep{width:100%;border-collapse:collapse;font-size:.88rem}
.rep th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:0 0 6px}
.rep th:first-child{text-align:left}
.rep td{padding:8px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rep td:first-child{text-align:left;font-family:var(--body);white-space:normal}
.rep td+td,.rep th+th{padding-left:10px}
.rep tr.sum td{font-weight:600;border-top:2px solid var(--ink)}
.up{color:var(--spend)} .down{color:var(--accent)} .same{color:var(--muted)}
.repwrap{overflow-x:auto}
.verdict{margin:0;font-size:.92rem}
.sample{background:var(--spend-soft);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.88rem}
.sample button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;white-space:nowrap}
@media (max-width:420px){.balance .big{font-size:2rem}.month span{min-width:7.5em;font-size:.9rem}}
@media (prefers-reduced-motion:no-preference){.meter i,.stack i{transition:width .3s}}
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>Štedna knjižica</h1>
  <p class="hint">Prijavi se nalogom koji ti je napravio administrator.</p>
  <input id="lEmail" type="email" autocomplete="username" placeholder="Email" required>
  <input id="lPass" type="password" autocomplete="current-password" placeholder="Lozinka" required>
  <button class="add primary" type="submit">Prijavi se</button>
  <p class="err" id="lErr" role="alert"></p>
</form>

<div class="wrap" id="app" hidden>
  <div class="who"><span id="whoName"></span><span class="status" id="status"></span><button class="link" id="logout" type="button">Odjavi se</button></div>
  <div class="top">
    <h1>Štedna knjižica</h1>
    <div class="month">
      <button class="iconbtn" id="prev" aria-label="Prethodni mesec">‹</button>
      <span id="mlabel"></span>
      <button class="iconbtn" id="next" aria-label="Sledeći mesec">›</button>
    </div>
  </div>


  <div class="vault" id="vault">
    <div>
      <div class="label">Ušteđevina</div>
      <div class="big num" id="saved"></div>
      <p class="hint" id="savedNote"></p>
    </div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="balance" id="balance">
    <div>
      <div class="label" id="leftLabel">Ostaje ovog meseca</div>
      <div class="big num" id="left"></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="flow">
      <div><span class="label">Prihod</span><span class="num" id="fIn"></span></div>
      <div><span class="label">Stalni</span><span class="num" id="fFix"></span></div>
      <div><span class="label">Ostali</span><span class="num" id="fVar"></span></div>
    </div>
    <div class="total" id="total"></div>
  </div>

  <section>
    <div class="head"><h2>Prihod</h2><span class="label">EUR</span></div>
    <label class="label" for="salary">Plata za ovaj mesec</label>
    <input id="salary" class="amount-in" inputmode="decimal" placeholder="0,00">
    <div class="list" id="extraList"></div>
    <div class="row">
      <input id="exName" placeholder="Dodatni prihod (npr. honorar)">
      <input id="exAmt" inputmode="decimal" placeholder="€" class="amt">
      <button class="add" id="exAdd">Dodaj</button>
    </div>
  </section>

  <section>
    <div class="head"><h2>Stalni troškovi</h2><span class="num fixed-amt" id="fixSum"></span></div>
    <p class="hint" id="fixHint"></p>
    <div class="list" id="fixList"></div>
    <div class="row">
      <input id="fxName" placeholder="Naziv (npr. Kirija)">
      <input id="fxAmt" inputmode="decimal" placeholder="€" class="amt">
      <button class="add" id="fxAdd">Dodaj</button>
    </div>
  </section>

  <section>
    <div class="head"><h2>Ostali troškovi</h2><span class="num fixed-amt" id="varSum"></span></div>
    <input id="vAmt" class="amount-in" inputmode="decimal" placeholder="Iznos €" aria-label="Iznos troška">
    <div class="chips" id="catChips" role="group" aria-label="Kategorija"></div>
    <div class="row">
      <input id="vNote" placeholder="Napomena (opciono)">
      <input id="vDate" type="date" aria-label="Datum">
    </div>
    <button class="add primary" id="vAdd">Zabeleži trošak</button>
    <div class="stack" id="stack"></div>
    <div class="cats" id="cats"></div>
    <div class="list" id="varList"></div>
  </section>

  <section>
    <div class="head"><h2 id="repTitle">Izveštaj</h2></div>
    <p class="verdict" id="verdict"></p>
    <div class="repwrap"><table class="rep" id="rep"></table></div>
  </section>
</div>

<script src="pocketbase.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
