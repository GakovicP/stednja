# Kopiraj u /etc/nginx/conf.d/stednja.conf i zameni domen.
# Certbot (certbot --nginx -d ...) posle sam dodaje HTTPS u ovaj blok.
server {
    listen 80;
    server_name stednja.tvojdomen.rs;

    client_max_body_size 5M;

    # Admin panel i prijava administratora NISU dostupni spolja.
    # Do panela se stiže samo preko SSH tunela (vidi README).
    location ^~ /_/ { deny all; }
    location ^~ /api/collections/_superusers/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uživo osvežavanje (realtime/SSE)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
